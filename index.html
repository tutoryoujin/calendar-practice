<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>한국어 달력 (Korean Calendar)📆</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="siteHeader"></div>

    <div class="app">

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabCal" aria-selected="true" type="button">
          <span class="ko">달력</span><span class="en">Calendar</span>
        </button>
        <button class="tab" role="tab" id="tabYear" aria-selected="false" type="button">
          <span class="ko">연간</span><span class="en">Year</span>
        </button>
        <button class="tab" role="tab" id="tabQuiz" aria-selected="false" type="button">
          <span class="ko">퀴즈</span><span class="en">Quiz</span>
        </button>
      </div>

      <!-- 달력 -->
      <section id="calView">
        <div class="box">
          <div class="month-head">
            <button class="nav" id="prevBtn" type="button" aria-label="이전 달 / Previous month">‹</button>
            <div class="month-title">
              <div class="digits" id="monthDigits"></div>
              <div class="reading" id="monthReading"></div>
            </div>
            <button class="nav" id="nextBtn" type="button" aria-label="다음 달 / Next month">›</button>
          </div>
          <div class="weekdays" id="weekdays"></div>
          <div class="grid" id="grid"></div>
          <button class="today-btn" id="todayBtn" type="button">
            <span class="ko">오늘로 가기</span><span class="en">Go to today</span>
          </button>
        </div>

        <div class="box" style="margin-top: 14px" id="panel" aria-live="polite"></div>
      </section>

      <!-- 연간 -->
      <section id="yearView" hidden>
        <div class="box">
          <div class="month-head">
            <button class="nav" id="yPrevBtn" type="button" aria-label="이전 해 / Previous year">‹</button>
            <div class="month-title">
              <div class="digits" id="yearDigits"></div>
              <div class="reading" id="yearReading"></div>
            </div>
            <button class="nav" id="yNextBtn" type="button" aria-label="다음 해 / Next year">›</button>
          </div>
          <div class="year-pick" id="yearPick" aria-live="polite"></div>
        </div>
        <div class="months" id="months"></div>
      </section>

      <!-- 퀴즈 -->
      <section id="quizView" hidden>
        <div class="box" id="qPlay">
          <div class="score">
            <span>문제 Question <b id="qNum">1 / 10</b></span>
            <span>맞힌 개수 Score <b id="scoreText">0</b></span>
          </div>
          <div class="q-label"><span class="ko">어떻게 읽어요?</span>How do you read this?</div>
          <div class="q-date" id="qDate"></div>
          <div class="opts" id="opts"></div>
          <div class="feedback" id="feedback"></div>
          <button class="btn ghost" id="qSpeak" type="button" hidden>
            <span class="ko">🔊 들어 보기</span><span class="en">Listen</span>
          </button>
          <button class="btn" id="qNext" type="button" hidden>
            <span class="ko" id="qNextKo">다음 문제</span><span class="en" id="qNextEn">Next question</span>
          </button>
        </div>
        <div class="box result" id="qResult" hidden aria-live="polite"></div>
      </section>
    </div>

    <div id="siteFooter"></div>

    <!-- 공통 셸: 마스코트 도형 주입 + 햄버거. 앱 스크립트보다 먼저. -->
    <script src="js/shell.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
